---
- name: Converge
  hosts: instance-backup
  become: true
  vars:
    backup_repository: sftp:backup-repo@backup-target:/srv/backups/instance
    backup_password: molecule-repository-password
    backup_ssh_private_key: "{{ lookup('file', lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/id_ed25519') }}"
    backup_ssh_known_hosts: "{{ lookup('file', lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/known_hosts') }}"
    backup_paths: [/srv/data]
    backup_exclude: ["*.tmp"]
    backup_hooks:
      - name: dump
        command: printf '%s' "$DUMP_SECRET" > "$BACKUP_HOOK_OUTPUT/dump.txt"
    backup_hook_environment:
      DUMP_SECRET: written by the hook
  roles:
    - role: "{{ lookup('ansible.builtin.env', 'MOLECULE_PROJECT_DIRECTORY') }}"
