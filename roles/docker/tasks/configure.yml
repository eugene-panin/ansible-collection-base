---
- name: Ensure the Docker configuration directory exists
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Render the daemon configuration
  ansible.builtin.copy:
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
    validate: /usr/bin/dockerd --validate --config-file %s
  notify: "restart docker"
