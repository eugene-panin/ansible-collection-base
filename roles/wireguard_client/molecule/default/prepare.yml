---
- name: Prepare
  hosts: all
  become: true
  tasks:
    - name: Look for wg before the role runs
      ansible.builtin.stat:
        path: /usr/bin/wg
      register: _wireguard_client_wg

    - name: Assert the image does not ship wg, so the role has to install it
      ansible.builtin.assert:
        that:
          - not _wireguard_client_wg.stat.exists
        quiet: true
