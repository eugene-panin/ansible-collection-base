---
- name: Validate role inputs
  ansible.builtin.assert:
    that:
      - firewall_ssh_port | int > 0
      - firewall_allow | type_debug == 'list'
      - firewall_allow | rejectattr('port', 'defined') | rejectattr('interface', 'defined') | list | length == 0
    fail_msg: firewall_allow is a list of rules, each with a port, an interface or both.
    quiet: true

- name: Refresh the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  register: _firewall_apt_cache
  until: _firewall_apt_cache is succeeded
  retries: 30
  delay: 10
  changed_when: false
  check_mode: false

- name: Ensure ufw is installed
  ansible.builtin.apt:
    name: ufw
    state: present
  register: _firewall_apt
  until: _firewall_apt is succeeded
  retries: 30
  delay: 10

- name: Allow SSH before anything is denied
  community.general.ufw:
    rule: allow
    port: "{{ firewall_ssh_port | string }}"
    proto: tcp
    comment: SSH
  when: not ansible_check_mode or _firewall_apt is not changed

- name: Allow the declared ports
  community.general.ufw:
    rule: allow
    port: "{{ item.port | string if item.port is defined else omit }}"
    proto: "{{ item.proto | default('tcp') if item.port is defined else omit }}"
    direction: "{{ 'in' if item.interface is defined else omit }}"
    interface: "{{ item.interface | default(omit) }}"
    from_ip: "{{ item.from | default('any') }}"
    comment: "{{ item.comment | default(omit) }}"
  loop: "{{ firewall_allow }}"
  loop_control:
    label: "{{ (item.port | string ~ '/' ~ item.proto | default('tcp')) if item.port is defined else 'all' }}{{ ' on ' ~ item.interface if item.interface is defined else '' }}"
  when: not ansible_check_mode or _firewall_apt is not changed

- name: Deny incoming by default, allow outgoing
  community.general.ufw:
    default: "{{ item.policy }}"
    direction: "{{ item.direction }}"
  loop:
    - direction: incoming
      policy: deny
    - direction: outgoing
      policy: allow
  loop_control:
    label: "{{ item.direction }} {{ item.policy }}"
  when: not ansible_check_mode or _firewall_apt is not changed

- name: Ensure ufw is enabled
  community.general.ufw:
    state: enabled
  when: not ansible_check_mode or _firewall_apt is not changed
