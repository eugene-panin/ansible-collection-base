---
argument_specs:
  main:
    short_description: Configure a WireGuard interface
    description:
      - Installs WireGuard, generates the interface private key once, renders
        the interface configuration with its peers and manages the
        wg-quick systemd unit.
    options:
      wireguard_interface:
        type: str
        default: wg0
        description: Interface name, also used for the config, key and unit names.
      wireguard_address:
        type: str
        default: 10.10.0.1/24
        description: This host's address on the mesh, with prefix length.
      wireguard_listen_port:
        type: int
        default: 51820
        description: UDP port the interface listens on.
      wireguard_peers:
        type: list
        elements: dict
        default: []
        description: Peers permitted to connect.
        options:
          public_key:
            type: str
            required: true
            description: The peer's WireGuard public key.
          allowed_ips:
            type: str
            required: true
            description: Addresses routed to that peer.
          name:
            type: str
            description: Comment written above the peer block.
          endpoint:
            type: str
            description: host:port, for peers this host dials out to.
          persistent_keepalive:
            type: int
            description: Seconds between keepalives, for peers behind NAT.
      wireguard_manage_firewall:
        type: bool
        default: true
        description:
          - Open the listen port with ufw. Requires ufw to be installed.
          - When false the role touches no firewall state.
      wireguard_private_key_path:
        type: str
        default: /etc/wireguard/wg0.key
        description:
          - Where the private key is stored. Generated once and never rotated
            by this role.
