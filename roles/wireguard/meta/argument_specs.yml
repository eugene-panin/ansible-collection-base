---
argument_specs:
  main:
    short_description: Configure a WireGuard interface
    description:
      - Installs WireGuard, takes the interface private key it is given or
        generates one once, renders
        the interface configuration with its peers and manages the
        wg-quick systemd unit.
    options:
      wireguard_interface:
        type: str
        default: wg0
        description: Interface name, also used for the config, key and unit names.
      wireguard_address:
        type: str
        default: 10.10.0.1/24
        description: This host's address on the mesh, with prefix length.
      wireguard_listen_port:
        type: int
        default: 51820
        description: UDP port the interface listens on.
      wireguard_peers:
        type: list
        elements: dict
        default: []
        description: Peers permitted to connect.
        options:
          public_key:
            type: str
            required: true
            description: The peer's WireGuard public key.
          allowed_ips:
            type: str
            required: true
            description: Addresses routed to that peer.
          preshared_key:
            type: str
            no_log: true
            description: A preshared key for this peer, base64 like a key, mixed into its handshake.
          name:
            type: str
            description: Comment written above the peer block.
          endpoint:
            type: str
            description: host:port, for peers this host dials out to.
          persistent_keepalive:
            type: int
            description: Seconds between keepalives, for peers behind NAT.
      wireguard_manage_firewall:
        type: bool
        default: true
        description:
          - Manage ufw rules for this interface. Requires ufw to be installed.
          - When false the role touches no firewall state, which leaves any
            rule it added earlier in place.
      wireguard_allow_mesh_traffic:
        type: bool
        default: true
        description:
          - Accept everything arriving through the tunnel.
          - Without it a default-deny host completes the handshake and then
            drops the traffic the tunnel was built for.
          - Setting it back to false removes the rule again.
          - Ignored when O(wireguard_manage_firewall=false).
      wireguard_private_key_path:
        type: str
        default: /etc/wireguard/{{ wireguard_interface }}.key
        description:
          - Where the private key is stored.
      wireguard_private_key:
        type: str
        default: ""
        no_log: true
        description:
          - The interface private key, base64 as wg genkey prints it, written to
            O(wireguard_private_key_path). Changing it rotates the key and
            restarts the interface; every peer then needs the new public key.
          - Empty, the role generates a key once and never rotates it.
