---
- name: Refresh the apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'
  changed_when: false

- name: Ensure WireGuard packages are installed
  ansible.builtin.package:
    name: "{{ _wireguard_packages }}"
    state: present
