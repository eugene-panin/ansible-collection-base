---
- name: Ensure the WireGuard configuration directory exists
  ansible.builtin.file:
    path: /etc/wireguard
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Check whether the interface private key already exists
  ansible.builtin.stat:
    path: "{{ wireguard_private_key_path }}"
  register: _wireguard_key_stat
  check_mode: false

- name: Write the interface private key given to the role
  ansible.builtin.copy:
    content: "{{ wireguard_private_key }}\n"
    dest: "{{ wireguard_private_key_path }}"
    owner: root
    group: root
    mode: '0600'
  when: wireguard_private_key | length > 0
  no_log: true

- name: Generate the interface private key
  ansible.builtin.shell:
    cmd: >-
      umask 077
      && wg genkey > {{ wireguard_private_key_path | quote }}.new
      && mv {{ wireguard_private_key_path | quote }}.new
      {{ wireguard_private_key_path | quote }}
    creates: "{{ wireguard_private_key_path }}"
  when: wireguard_private_key | length == 0

- name: Read the interface private key
  ansible.builtin.slurp:
    src: "{{ wireguard_private_key_path }}"
  register: _wireguard_private_key_slurp
  when:
    - wireguard_private_key | length == 0
    - _wireguard_key_stat.stat.exists or not ansible_check_mode
  no_log: true

- name: Settle the interface private key
  ansible.builtin.set_fact:
    _wireguard_private_key: >-
      {{ wireguard_private_key if wireguard_private_key | length > 0
         else _wireguard_private_key_slurp.content | default('') | b64decode | trim }}
  no_log: true

- name: Assert the interface private key is not empty
  ansible.builtin.assert:
    that:
      - _wireguard_private_key | length > 0
    fail_msg: "{{ wireguard_private_key_path }} is empty, remove it and run again"
    quiet: true
  when: not ansible_check_mode

- name: Derive the interface public key
  ansible.builtin.command:
    argv:
      - wg
      - pubkey
    stdin: "{{ _wireguard_private_key }}"
  register: _wireguard_pubkey
  when:
    - _wireguard_private_key | length > 0
    - not (ansible_check_mode and _wireguard_install is changed)
  changed_when: false
  check_mode: false
  no_log: true

- name: Publish the interface public key
  ansible.builtin.set_fact:
    wireguard_public_key: "{{ _wireguard_pubkey.stdout | trim }}"
  when: _wireguard_pubkey.stdout is defined

- name: Render the interface configuration
  ansible.builtin.template:
    src: wg.conf.j2
    dest: "/etc/wireguard/{{ wireguard_interface }}.conf"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  notify: "restart wireguard"

- name: Allow the WireGuard listen port
  community.general.ufw:
    rule: allow
    port: "{{ wireguard_listen_port | string }}"
    proto: udp
    comment: "WireGuard {{ wireguard_interface }}"
  when: wireguard_manage_firewall | bool

- name: Manage the rule for traffic arriving through the tunnel
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ wireguard_interface }}"
    comment: "WireGuard {{ wireguard_interface }} mesh"
    delete: "{{ not (wireguard_allow_mesh_traffic | bool) }}"
  when: wireguard_manage_firewall | bool
