---
dependency:
  name: galaxy
  options:
    requirements-file: molecule/firewall/requirements.yml
driver:
  name: docker
platforms:
  - name: instance-firewall
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    capabilities:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  playbooks:
    prepare: prepare.yml
    converge: converge.yml
    side_effect: side_effect.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - destroy
