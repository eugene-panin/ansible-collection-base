---
- name: Verify
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Stat the rendered interface configuration
      ansible.builtin.stat:
        path: /etc/wireguard/wg0.conf
      register: _wireguard_conf

    - name: Stat the generated private key
      ansible.builtin.stat:
        path: /etc/wireguard/wg0.key
      register: _wireguard_key

    - name: Assert both files exist and are root-only
      ansible.builtin.assert:
        that:
          - _wireguard_conf.stat.exists
          - _wireguard_conf.stat.mode == '0600'
          - _wireguard_key.stat.exists
          - _wireguard_key.stat.mode == '0600'
        quiet: true

    - name: Read the rendered configuration
      ansible.builtin.slurp:
        src: /etc/wireguard/wg0.conf
      register: _wireguard_rendered
      no_log: true

    - name: Assert the peer made it into the configuration
      ansible.builtin.assert:
        that:
          - "'10.10.0.2/32' in _wireguard_rendered_text"
          - "'ListenPort = 51820' in _wireguard_rendered_text"
        quiet: true
      vars:
        _wireguard_rendered_text: "{{ _wireguard_rendered.content | b64decode }}"

    - name: Query the interface unit state
      ansible.builtin.command:
        argv:
          - systemctl
          - show
          - wg-quick@wg0.service
          - --property=UnitFileState
          - --property=ActiveState
          - --value
      register: _wireguard_unit
      changed_when: false
      check_mode: false

    - name: Assert the interface unit is enabled and running
      ansible.builtin.assert:
        that:
          - "'enabled' in _wireguard_unit.stdout_lines"
          - "'active' in _wireguard_unit.stdout_lines"
        quiet: true

    - name: Query the configured peers
      ansible.builtin.command:
        argv:
          - wg
          - show
          - wg0
          - peers
      register: _wireguard_wg_peers
      changed_when: false
      check_mode: false

    - name: Assert the peer is loaded into the running interface
      ansible.builtin.assert:
        that:
          - "'nZ0Dk1Q5m6oM2h9mWMSaBpS1lE3fXpTK0cN4hGZL0S8=' in _wireguard_wg_peers.stdout_lines"
        quiet: true

    - name: List installed kernel and DKMS packages
      ansible.builtin.shell:
        cmd: set -o pipefail; dpkg-query -W -f='${Package} ${db:Status-Status}\n' 'linux-image*' '*-dkms' dkms 2>/dev/null | awk '$2 == "installed"' || true
        executable: /bin/bash
      register: _wireguard_test_kernel
      changed_when: false

    - name: Assert WireGuard brought no kernel or DKMS package with it
      ansible.builtin.assert:
        that:
          - _wireguard_test_kernel.stdout_lines | length == 0
        quiet: true
