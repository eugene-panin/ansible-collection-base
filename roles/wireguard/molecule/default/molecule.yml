---
driver:
  name: docker
platforms:
  - name: instance-ubuntu2404
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
    privileged: true
    pre_build_image: true
    capabilities:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun
provisioner:
  name: ansible
  config_options:
    defaults:
      callback_result_format: yaml
  playbooks:
    converge: converge.yml
    verify: verify.yml
verifier:
  name: ansible
scenario:
  test_sequence:
    - dependency
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - check
    - verify
    - destroy
