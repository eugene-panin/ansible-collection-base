---
name: ci

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - '**.md'
      - LICENSE
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install linters
        run: python -m pip install --upgrade ansible-core ansible-lint yamllint

      - name: yamllint
        run: yamllint .

      - name: ansible-lint
        run: ansible-lint --profile production

  molecule:
    name: molecule (${{ matrix.role }}, ${{ matrix.distro }}, ansible-core ${{ matrix.ansible_core }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        role: [wireguard, wireguard_client, docker, firewall]
        distro: [ubuntu2404, ubuntu2204, debian12]
        ansible_core: [latest]
        include:
          - role: wireguard
            distro: ubuntu2404
            ansible_core: '2.19'
          - role: wireguard_client
            distro: ubuntu2404
            ansible_core: '2.19'
          - role: docker
            distro: ubuntu2404
            ansible_core: '2.19'
          - role: firewall
            distro: ubuntu2404
            ansible_core: '2.19'
    env:
      MOLECULE_DISTRO: ${{ matrix.distro }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install molecule
        run: >-
          python -m pip install --upgrade
          ${{ matrix.ansible_core == 'latest' && 'ansible-core' || format('ansible-core=={0}.*', matrix.ansible_core) }}
          molecule 'molecule-plugins[docker]' docker

      - name: Load the wireguard kernel module
        run: sudo modprobe wireguard && lsmod | grep wireguard

      - name: molecule test
        run: molecule test --all
        working-directory: roles/${{ matrix.role }}

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ansible-core
        run: python -m pip install --upgrade ansible-core

      - name: Build the collection artifact
        run: ansible-galaxy collection build --output-path dist

      - uses: actions/upload-artifact@v6
        with:
          name: collection
          path: dist/*.tar.gz
